<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudentHub</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- BACKGROUND IMAGE -->
<div class="bg-image"></div>
<div class="overlay"></div>


<main class="layout">

<!-- LEFT HERO -->
<section class="hero">
    <h1>
        Grow.<br>
        <span>Learn.</span><br>
        Succeed.
    </h1>

    <p>
        Join StudentHub and unlock a world of knowledge and opportunities.
    </p>

    <div class="features">
        <div><i class="fa fa-graduation-cap"></i> Smart Learning</div>
        <div><i class="fa fa-chart-line"></i> Track Progress</div>
        <div><i class="fa fa-users"></i> Connect & Grow</div>
    </div>
</section>

<!-- RIGHT FORM -->
<section class="form-section">

<div class="card">

    <h2>Create Account</h2>

    <form id="form">

        <div class="input">
            <i class="fa fa-user"></i>
            <input type="text" required>
            <label>Full Name</label>
        </div>

        <div class="input">
            <i class="fa fa-envelope"></i>
            <input type="email" required>
            <label>Email</label>
        </div>

        <div class="input">
            <i class="fa fa-phone"></i>
            <input type="tel" required>
            <label>Mobile</label>
        </div>

        <div class="input">
            <i class="fa fa-lock"></i>
            <input type="password" id="password" required>
            <label>Password</label>

            <div class="strength">
                <div id="bar"></div>
            </div>
            <p id="strengthText"></p>
        </div>

        <div class="input">
            <i class="fa fa-lock"></i>
            <input type="password" required>
            <label>Confirm Password</label>
        </div>

        <!-- DROPDOWN -->
        <div class="select-group">
            <select required>
                <option value="">Select Course</option>
                <option>IT</option>
                <option>CE</option>
                <option>CSE</option>
            </select>
        </div>

        <div class="select-group">
            <select required>
                <option value="">Select Year</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
            </select>
        </div>

        <!-- RADIO -->
        <div class="radio-group">
            <label><input type="radio" name="g"> Male</label>
            <label><input type="radio" name="g"> Female</label>
            <label><input type="radio" name="g"> Other</label>
        </div>

        <!-- TERMS -->
        <div class="terms">
            <label>
                <input type="checkbox"> I agree to Terms
            </label>
        </div>

        <button type="submit">Register</button>

    </form>

</div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
